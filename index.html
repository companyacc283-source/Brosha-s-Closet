<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brosha's Closet - ডেমরা, ঢাকা</title>
<meta name="description" content="Brosha's Closet: বাচ্চাদের পোশাক, পাঞ্জাবি, থ্রি-পিস, গার্লস ড্রেস ও ঈদ কালেকশন। সারা বাংলাদেশে ডেলিভারি।">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--k:#000;--w:#fff;--g:#b8902f;--gl:#f5ecd4;--l:#e6e6e6;--t:#555}
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--w);color:var(--k);font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--k);color:var(--w);display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
header b{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--g);letter-spacing:.5px}
header button{background:none;border:1px solid var(--g);color:var(--w);padding:6px 12px;border-radius:20px;font:inherit;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--l)}
.chip{flex:none;border:1px solid var(--k);background:var(--w);color:var(--k);padding:6px 14px;border-radius:20px;font:inherit;cursor:pointer}
.chip.on{background:var(--k);color:var(--g);border-color:var(--k)}
main{padding:14px 12px 30px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}main{max-width:1000px;margin:auto}}
.card{cursor:pointer;border:1px solid var(--l)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--l)}
.inf{padding:8px 10px 10px}.nm{font-weight:600;line-height:1.3}
.pr{color:var(--g);font-weight:700;font-size:17px}.pr s{color:var(--t);font-weight:400;font-size:13px;margin-left:6px}
.out{color:#b00020;font-size:13px}.empty{padding:30px 0;text-align:center;color:var(--t);grid-column:1/-1}
footer{background:var(--k);color:#ccc;text-align:center;padding:22px 16px;font-size:13px}footer a{color:var(--g)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
.sheet{background:var(--w);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px 24px;position:relative;border-top:3px solid var(--g)}
.x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:22px;cursor:pointer}
.big{width:100%;max-height:50vh;object-fit:cover;margin-bottom:10px}
h2{font-size:20px;margin-bottom:8px}h3{margin-bottom:8px}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid #bbb;font:inherit;margin-bottom:8px;background:var(--w);border-radius:0}
textarea{min-height:70px}
.btn{display:block;width:100%;text-align:center;background:var(--k);color:var(--g);border:0;padding:13px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px;text-decoration:none}
.btn:disabled{opacity:.5}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--l)}
.ci img{width:56px;height:70px;object-fit:cover}.ci>div:nth-child(2){flex:1}
.q{display:flex;gap:6px;align-items:center}.q button{width:30px;height:30px;border:1px solid var(--k);background:var(--w);cursor:pointer}
.tot{font-size:18px;margin:10px 0;text-align:right}
.form{border:1px solid var(--l);padding:12px;margin-bottom:12px}
.login{max-width:360px;margin:60px auto;padding:0 16px}.login a{display:block;text-align:center;margin-top:14px;color:var(--t)}
.pay{background:var(--gl);padding:10px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" onclick="if(event.target==this)closeM()"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient('https://guejjcyzbmagriskgmop.supabase.co','sb_publishable_5uNlCWo0ZoGVNAyEwZ1jTw_-BDU2gVi');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tk=n=>'৳'+Number(n||0).toLocaleString('en-US');
const CATS=['Kids Clothing','Punjabi','Three-piece Dresses',"Girls' Dresses",'Eid Collection','New Arrivals','Discount Products'],ALL=['All',...CATS];
const PN={COD:'ক্যাশ অন ডেলিভারি',bkash:'bKash',nagad:'Nagad',rocket:'Rocket'};
let P=[],cart=[],cat=0,S={wa:'',bkash:'',nagad:'',rocket:'',d_in:'60',d_out:'120'};
try{cart=JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}$('#cc')&&($('#cc').textContent=cart.reduce((a,c)=>a+c.q,0))};
const sub=()=>cart.reduce((a,c)=>a+c.price*c.q,0);
async function loadS(){try{const{data}=await SB.from('settings').select('*');(data||[]).forEach(r=>S[r.key]=r.value)}catch(e){}}
function modal(h){$('#modal').innerHTML=`<div class="sheet"><button class="x" onclick="closeM()">✕</button>${h}</div>`;$('#modal').classList.add('show')}
function closeM(){$('#modal').classList.remove('show')}

/* ---------- দোকান ---------- */
async function shop(){
 $('#app').innerHTML=`<header><b>Brosha's Closet</b><button onclick="openCart()">কার্ট <span id="cc">${cart.reduce((a,c)=>a+c.q,0)}</span></button></header><div class="chips" id="chips"></div><main><div class="grid" id="grid"><p class="empty">লোড হচ্ছে...</p></div></main><footer>দোকান ২৫, পূর্বানী প্লাজা, কোনাপাড়া, ডেমরা, ঢাকা<br>সারা বাংলাদেশে ডেলিভারি<br><a href="https://facebook.com/broshacloset75">Facebook পেজ</a> | <a href="#admin">Admin</a></footer>`;
 await loadS();
 const{data}=await SB.from('products').select('*').order('created_at',{ascending:false});
 P=data||[];draw()}
function setCat(i){cat=i;draw()}
function draw(){
 $('#chips').innerHTML=ALL.map((c,i)=>`<button class="chip ${i==cat?'on':''}" onclick="setCat(${i})">${esc(c)}</button>`).join('');
 const L=P.filter(p=>cat==0||p.category==ALL[cat]);
 $('#grid').innerHTML=L.length?L.map(p=>`<div class="card" onclick="openP('${p.id}')"><img loading="lazy" src="${esc(p.image_url)}" alt="${esc(p.name)}"><div class="inf"><div class="nm">${esc(p.name)}</div><div class="pr">${tk(p.price)}${p.old_price?`<s>${tk(p.old_price)}</s>`:''}</div>${p.stock<=0?'<div class="out">স্টক নেই</div>':''}</div></div>`).join(''):'<p class="empty">এই ক্যাটাগরিতে এখনো প্রোডাক্ট নেই।</p>'}
function openP(id){
 const p=P.find(x=>x.id==id),sz=(p.sizes||'').split(',').map(s=>s.trim()).filter(Boolean);
 modal(`<img class="big" src="${esc(p.image_url)}" alt="${esc(p.name)}"><h2>${esc(p.name)}</h2><div class="pr">${tk(p.price)}${p.old_price?`<s>${tk(p.old_price)}</s>`:''}</div>${sz.length?`<label>সাইজ</label><select id="sz">${sz.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}<button class="btn" ${p.stock<=0?'disabled':''} onclick="add('${p.id}')">${p.stock<=0?'স্টক নেই':'কার্টে যোগ করুন'}</button>`)}
function add(id){
 const p=P.find(x=>x.id==id),s=$('#sz')?$('#sz').value:'',k=cart.find(c=>c.id==id&&c.size==s);
 k?k.q++:cart.push({id,name:p.name,price:p.price,img:p.image_url,size:s,q:1});save();closeM()}
function qty(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);save();openCart()}
function fee(){return +($('#area')&&$('#area').value=='out'?S.d_out:S.d_in)||0}
function tot(){$('#tt').textContent=tk(sub()+fee())}
function pmc(){const m=$('#pm').value;$('#pi').innerHTML=m=='COD'?'':`<div class="pay">${PN[m]} নম্বর <b>${esc(S[m])}</b>-এ Send Money করুন, তারপর TrxID লিখুন।</div><input id="trx" placeholder="TrxID">`}
function openCart(){
 if(!cart.length)return modal('<h2>কার্ট খালি</h2><p>পছন্দের প্রোডাক্ট কার্টে যোগ করুন।</p>');
 const pays=['COD',...['bkash','nagad','rocket'].filter(k=>S[k])];
 modal(`<h2>আপনার কার্ট</h2>${cart.map((c,i)=>`<div class="ci"><img src="${esc(c.img)}" alt=""><div><b>${esc(c.name)}</b>${c.size?` (${esc(c.size)})`:''}<br>${tk(c.price)}</div><div class="q"><button onclick="qty(${i},-1)">−</button>${c.q}<button onclick="qty(${i},1)">+</button></div></div>`).join('')}
<label>ডেলিভারি এলাকা</label><select id="area" onchange="tot()"><option value="in">ঢাকার ভেতরে (${tk(S.d_in)})</option><option value="out">ঢাকার বাইরে (${tk(S.d_out)})</option></select>
<div class="tot">মোট: <b id="tt"></b></div>
<input id="nm" placeholder="আপনার নাম"><input id="ph" type="tel" placeholder="মোবাইল নম্বর (01XXXXXXXXX)"><textarea id="ad" placeholder="সম্পূর্ণ ঠিকানা"></textarea>
<label>পেমেন্ট</label><select id="pm" onchange="pmc()">${pays.map(p=>`<option value="${p}">${PN[p]}</option>`).join('')}</select><div id="pi"></div>
<button class="btn" id="ob" onclick="order()">অর্ডার করুন</button>`);tot()}
async function order(){
 const v=id=>$('#'+id)?$('#'+id).value.trim():'',nm=v('nm'),ph=v('ph'),ad=v('ad'),pm=v('pm'),trx=v('trx')||null;
 if(!nm||!/^01\d{9}$/.test(ph)||ad.length<8)return alert('নাম, সঠিক মোবাইল নম্বর (01XXXXXXXXX) ও পূর্ণ ঠিকানা দিন।');
 if(pm!='COD'&&!trx)return alert('TrxID লিখুন।');
 const f=fee(),total=sub()+f;$('#ob').disabled=true;
 const{error}=await SB.from('orders').insert({customer_name:nm,phone:ph,address:ad,items:cart.map(({name,size,q,price})=>({name,size,q,price})),total,payment_method:pm,trx_id:trx});
 if(error){$('#ob').disabled=false;return alert('অর্ডার হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।')}
 const msg=`নতুন অর্ডার - Brosha's Closet\n${cart.map(c=>`${c.name}${c.size?' ('+c.size+')':''} x${c.q} = ${tk(c.price*c.q)}`).join('\n')}\nডেলিভারি: ${tk(f)}\nমোট: ${tk(total)}\nপেমেন্ট: ${PN[pm]}${trx?' TrxID '+trx:''}\nনাম: ${nm}\nফোন: ${ph}\nঠিকানা: ${ad}`;
 cart=[];save();
 modal(`<h2>অর্ডার সম্পন্ন হয়েছে</h2><p>ধন্যবাদ ${esc(nm)}। আমরা শীঘ্রই ফোনে যোগাযোগ করব।</p>${S.wa?`<a class="btn" target="_blank" href="https://wa.me/${esc(S.wa)}?text=${encodeURIComponent(msg)}">WhatsApp-এ অর্ডার পাঠান</a>`:''}`)}

/* ---------- অ্যাডমিন ---------- */
async function admin(){
 const{data:{session}}=await SB.auth.getSession();
 if(!session){$('#app').innerHTML=`<div class="login"><h2>Admin Login</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><a href="#">সাইটে ফিরুন</a></div>`;return}
 $('#app').innerHTML=`<header><b>Admin</b><button onclick="SB.auth.signOut().then(admin)">Logout</button></header><div class="chips"><button class="chip on" onclick="tab('p',this)">প্রোডাক্ট</button><button class="chip" onclick="tab('o',this)">অর্ডার</button><button class="chip" onclick="tab('s',this)">সেটিংস</button><button class="chip" onclick="location.hash=''">সাইট দেখুন</button></div><main id="tb"></main>`;tab('p')}
async function login(){const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?alert('ইমেইল বা পাসওয়ার্ড ভুল।'):admin()}
function tab(t,b){if(b){document.querySelectorAll('.chips .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')}({p:aProd,o:aOrd,s:aSet})[t]()}
async function aProd(){
 const{data}=await SB.from('products').select('*').order('created_at',{ascending:false});
 $('#tb').innerHTML=`<div class="form"><h3>নতুন প্রোডাক্ট</h3><input id="pn" placeholder="নাম"><input id="pp" type="number" placeholder="দাম"><input id="po" type="number" placeholder="আগের দাম (ঐচ্ছিক)"><select id="pc">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="ps" placeholder="সাইজ (কমা দিয়ে, যেমন S,M,L)"><input id="pk" type="number" placeholder="স্টক কতটি"><input id="pf" type="file" accept="image/*"><button class="btn" id="sv" onclick="addP()">প্রোডাক্ট সেভ করুন</button></div>${(data||[]).map(p=>`<div class="ci"><img src="${esc(p.image_url)}" alt=""><div><b>${esc(p.name)}</b><br>${tk(p.price)} | স্টক ${p.stock}${p.is_active?'':' | লুকানো'}</div><div class="q"><button title="দেখান/লুকান" onclick="tg('${p.id}',${!p.is_active})">👁</button><button title="মুছুন" onclick="dl('${p.id}')">🗑</button></div></div>`).join('')}`}
function shrink(f){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.8)};i.src=URL.createObjectURL(f)})}
async function addP(){
 const f=$('#pf').files[0],n=$('#pn').value.trim(),pr=+$('#pp').value;
 if(!n||!pr||!f)return alert('নাম, দাম ও ছবি দিন।');
 $('#sv').disabled=true;const path=Date.now()+'.jpg',b=await shrink(f);
 const u=await SB.storage.from('products').upload(path,b,{contentType:'image/jpeg'});
 if(u.error){$('#sv').disabled=false;return alert('ছবি আপলোড হয়নি: '+u.error.message)}
 const{error}=await SB.from('products').insert({name:n,price:pr,old_price:+$('#po').value||null,category:$('#pc').value,sizes:$('#ps').value,stock:+$('#pk').value||0,image_url:SB.storage.from('products').getPublicUrl(path).data.publicUrl});
 error?(alert(error.message),$('#sv').disabled=false):aProd()}
async function tg(id,v){await SB.from('products').update({is_active:v}).eq('id',id);aProd()}
async function dl(id){if(confirm('এই প্রোডাক্ট মুছে ফেলবেন?')){await SB.from('products').delete().eq('id',id);aProd()}}
async function aOrd(){
 const{data}=await SB.from('orders').select('*').order('created_at',{ascending:false}),ST=['Pending','Confirmed','Shipped','Delivered','Cancelled'];
 $('#tb').innerHTML=(data||[]).map(o=>`<div class="form"><b>#${o.order_no} ${esc(o.customer_name)}</b> | <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.address)}<br>${(o.items||[]).map(i=>`${esc(i.name)} ${esc(i.size||'')} x${i.q}`).join('<br>')}<br><b>${tk(o.total)}</b> | ${esc(PN[o.payment_method]||o.payment_method)}${o.trx_id?' | '+esc(o.trx_id):''}<select onchange="us('${o.id}',this.value)">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="empty">এখনো কোনো অর্ডার নেই।</p>'}
async function us(id,s){const{error}=await SB.from('orders').update({status:s}).eq('id',id);if(error)alert('স্ট্যাটাস বদলায়নি')}
const SF=[['wa','WhatsApp নম্বর (88017XXXXXXXX ফরম্যাটে)'],['bkash','bKash নম্বর'],['nagad','Nagad নম্বর'],['rocket','Rocket নম্বর'],['d_in','ঢাকার ভেতরে ডেলিভারি চার্জ'],['d_out','ঢাকার বাইরে ডেলিভারি চার্জ']];
async function aSet(){await loadS();$('#tb').innerHTML=`<div class="form">${SF.map(f=>`<label>${f[1]}</label><input id="s_${f[0]}" value="${esc(S[f[0]])}">`).join('')}<button class="btn" onclick="svS()">সেটিংস সেভ করুন</button></div>`}
async function svS(){const{error}=await SB.from('settings').upsert(SF.map(f=>({key:f[0],value:$('#s_'+f[0]).value.trim()})));alert(error?'সেভ হয়নি। settings টেবিল বানানো হয়েছে কি না দেখুন।':'সেভ হয়েছে।')}

const route=()=>{closeM();location.hash=='#admin'?admin():shop()};
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
