 $('#tb').innerHTML=`<div class="form"><h3>${ed.id?'প্রোডাক্ট এডিট':'নতুন প্রোডাক্ট'}</h3><input placeholder="নাম" value="${esc(ed.name)}" oninput="ed.name=this.value"><textarea placeholder="বিবরণ" oninput="ed.description=this.value">${esc(ed.description)}</textarea><select onchange="ed.category_id=this.value">${CT.map(c=>`<option value="${c.id}" ${c.id==ed.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input type="number" placeholder="দাম" value="${esc(ed.price)}" oninput="ed.price=this.value"><input type="number" placeholder="আগের দাম (ঐচ্ছিক)" value="${esc(ed.old_price)}" oninput="ed.old_price=this.value">${[['featured','ফিচার্ড'],['best_seller','বেস্ট সেলার'],['is_active','প্রকাশিত']].map(f=>`<label><input type="checkbox" style="width:auto" ${ed[f[0]]?'checked':''} onchange="ed.${f[0]}=this.checked"> ${f[1]}</label>`).join('')}</div>${ed.vs.map((v,i)=>`<div class="form"><h3>রঙ ${i+1}</h3><input placeholder="রঙের নাম (যেমন Cream)" value="${esc(v.color)}" oninput="ed.vs[${i}].color=this.value"><input placeholder="SKU (ঐচ্ছিক)" value="${esc(v.sku)}" oninput="ed.vs[${i}].sku=this.value"><input type="number" placeholder="এই রঙের আলাদা দাম (ঐচ্ছিক)" value="${esc(v.price)}" oninput="ed.vs[${i}].price=this.value"><input placeholder="সাইজ:স্টক, যেমন S:5,M:3,L:2" value="${esc(v.sizes)}" oninput="ed.vs[${i}].sizes=this.value"><div class="th">${v.imgs.map((m,j)=>`<div class="sw ${j?'':'on'}"><img src="${esc(typeof m=='string'?m:m.u)}" alt=""><button onclick="mk(${i},${j})">★</button><button onclick="rm(${i},${j})">✕</button></div>`).join('')}</div><input type="file" accept="image/*" multiple onchange="ai(${i},this)"><div class="hint">★ = মেইন ছবি। প্রতি রঙে সর্বোচ্চ ১০টি ছবি।</div>${ed.vs.length>1?`<button class="btn ol" onclick="ed.vs.splice(${i},1);aEd()">এই রঙ মুছুন</button>`:''}</div>`).join('')}<button class="btn ol" onclick="ed.vs.push(nv());aEd()">আরেকটি রঙ যোগ করুন</button><button class="btn" id="sv" onclick="saveP()">সেভ করুন</button><button class="btn ol" onclick="aProd()">বাতিল</button>`}
const ai=(i,el)=>{const v=ed.vs[i];[...el.files].slice(0,10-v.imgs.length).forEach(f=>v.imgs.push({f,u:URL.createObjectURL(f)}));aEd()},mk=(i,j)=>{const a=ed.vs[i].imgs;a.unshift(a.splice(j,1)[0]);aEd()},rm=(i,j)=>{ed.vs[i].imgs.splice(j,1);aEd()};
const parseSz=s=>{const o={};String(s).split(',').forEach(x=>{const[k,n]=x.split(':');if(k&&k.trim())o[k.trim()]=Math.max(0,parseInt(n)||0)});return o};
const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'p';
function shrink(f,m=900,t='image/jpeg',ql=.8){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(i,0,0,c.width,c.height);c.toBlob(r,t,ql)};i.src=URL.createObjectURL(f)})}
async function saveP(){
 const bt=$('#sv'),fail=m=>{bt.disabled=false;bt.textContent='সেভ করুন';alert(m)},n=ed.name.trim(),pr=+ed.price;
 if(!n||!pr||!ed.category_id)return alert('নাম, দাম ও ক্যাটাগরি দিন।');
 if(ed.vs.some(v=>!v.imgs.length||!Object.keys(parseSz(v.sizes)).length))return alert('প্রতিটি রঙে কমপক্ষে একটি ছবি ও সাইজ দিন।');
 bt.disabled=true;bt.textContent='সেভ হচ্ছে...';
 const row={name:n,slug:ed.slug||slugify(n)+'-'+Date.now().toString(36).slice(-4),description:ed.description,category_id:ed.category_id,price:pr,old_price:+ed.old_price||null,featured:ed.featured,best_seller:ed.best_seller,is_active:ed.is_active};
 const r=ed.id?await SB.from('products').update(row).eq('id',ed.id):await SB.from('products').insert(row).select('id').single();
 if(r.error)return fail(r.error.message);const id=ed.id||r.data.id,keep=[];
 for(const[k,v]of ed.vs.entries()){
  const urls=[];
  for(const m of v.imgs){if(typeof m=='string'){urls.push(m);continue}
   const path=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg',u=await SB.storage.from('products').upload(path,await shrink(m.f),{contentType:'image/jpeg'});
   if(u.error)return fail('ছবি আপলোড হয়নি: '+u.error.message);urls.push(SB.storage.from('products').getPublicUrl(path).data.publicUrl)}
  const vr={product_id:id,color:v.color.trim(),sku:v.sku||null,price:+v.price||null,images:urls,sizes:parseSz(v.sizes),sort:k},
   x=v.id?await SB.from('product_variants').update(vr).eq('id',v.id).select('id').single():await SB.from('product_variants').insert(vr).select('id').single();
  if(x.error)return fail(x.error.message);keep.push(x.data.id)}
 await SB.from('product_variants').delete().eq('product_id',id).not('id','in','('+keep.join(',')+')');aProd()}
async function tgP(id,v){await SB.from('products').update({is_active:v}).eq('id',id);aProd()}
async function delP(id){if(confirm('এই প্রোডাক্ট মুছে ফেলবেন?')){await SB.from('products').delete().eq('id',id);aProd()}}
async function aCat(){
 const{data}=await SB.from('categories').select('*').order('sort');CT=data||[];
 $('#tb').innerHTML=`<div class="form"><input id="cn" placeholder="নতুন ক্যাটাগরির নাম"><button class="btn" onclick="addCat()">যোগ করুন</button></div>${CT.map(c=>`<div class="ci"><div>${esc(c.name)}</div><div class="q"><button onclick="renC('${c.id}')">✎</button><button onclick="delC('${c.id}')">🗑</button></div></div>`).join('')}`}
async function addCat(){const n=$('#cn').value.trim();if(n){await SB.from('categories').insert({name:n,sort:CT.length+1});aCat()}}
async function renC(id){const n=prompt('নতুন নাম',catName(id));if(n){await SB.from('categories').update({name:n}).eq('id',id);aCat()}}
async function delC(id){if(confirm('ক্যাটাগরি মুছবেন?')){await SB.from('categories').delete().eq('id',id);aCat()}}
async function aRev(){
 const{data}=await SB.from('reviews').select('*,products(name)').order('created_at',{ascending:false});
 $('#tb').innerHTML=(data||[]).map(r=>`<div class="form"><b>${esc(r.products&&r.products.name)}</b><br><span class="rt">${star(r.rating)}</span> ${esc(r.name)}${r.is_approved?'':' (লুকানো)'}<br>${esc(r.comment||'')}${r.image_url?`<br><img src="${esc(r.image_url)}" alt="" style="max-width:140px;margin-top:6px">`:''}<div class="two"><button class="btn ol" onclick="rvSet('${r.id}',${!r.is_approved})">${r.is_approved?'লুকান':'দেখান'}</button><button class="btn ol" onclick="rvDel('${r.id}')">মুছুন</button></div></div>`).join('')||'<p class="empty">এখনো কোনো রিভিউ নেই।</p>'}
async function rvSet(id,v){await SB.from('reviews').update({is_approved:v}).eq('id',id);aRev()}
async function rvDel(id){if(confirm('এই রিভিউ মুছে ফেলবেন?')){await SB.from('reviews').delete().eq('id',id);aRev()}}
const ST=['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'];
async function aOrd(){
 const{data}=await SB.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});OL=data||[];const L=OL.filter(o=>!OF||o.status==OF);
 $('#tb').innerHTML=`<select onchange="OF=this.value;aOrd()"><option value="">সব অর্ডার (${OL.length})</option>${ST.map(s=>`<option ${s==OF?'selected':''}>${s}</option>`).join('')}</select>`+(L.map(o=>`<div class="form"><b>BC-${o.order_no} | ${esc(o.customer_name)}</b><br><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.alt_phone?' / '+esc(o.alt_phone):''}<br>${esc(o.address)}, ${esc(o.thana||'')}, ${esc(o.district)}<br>${o.order_items.map(i=>`${esc(i.name)} ${esc(i.color)} ${esc(i.size)} x${i.qty}`).join('<br>')}<br>${o.note?`নোট: ${esc(o.note)}<br>`:''}<b>${tk(o.total)}</b> (ডেলিভারি ${tk(o.delivery)}) | ${esc(o.payment_method)} ${esc(o.trx_id||'')}<div class="two"><select onchange="us('${o.id}','status',this.value)">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><select onchange="us('${o.id}','payment_status',this.value)">${['Unpaid','Paid'].map(s=>`<option ${s==o.payment_status?'selected':''}>${s}</option>`).join('')}</select></div><div class="two"><button class="btn ol" onclick="invoice(OL.find(x=>x.id=='${o.id}'))">ইনভয়েস</button><a class="btn ol" target="_blank" href="https://wa.me/88${esc(o.phone)}">WhatsApp</a></div></div>`).join('')||'<p class="empty">কোনো অর্ডার নেই।</p>')}
async function us(id,f,v){if(v=='Cancelled'&&!confirm('বাতিল করলে স্টক ফেরত যাবে। নিশ্চিত?'))return aOrd();const{error}=await SB.from('orders').update({[f]:v}).eq('id',id);if(error)alert('বদলায়নি');aOrd()}
const SF=[['wa','WhatsApp নম্বর (8801XXXXXXXXX)'],['bkash','bKash নম্বর'],['nagad','Nagad নম্বর'],['rocket','Rocket নম্বর'],['d_in','ঢাকা জেলায় ডেলিভারি চার্জ'],['d_out','ঢাকার বাইরে ডেলিভারি চার্জ'],['hero','হোমপেজের শিরোনাম'],['fb','Facebook পেজের লিংক'],['info','দোকানের তথ্য (ডেলিভারি কতদিনে, রিটার্ন নিয়ম ইত্যাদি। AI সহকারী এটা দেখে উত্তর দেবে)']];
const upBlock=(k,t,h)=>`<div class="form"><b>${t}</b><div class="hint">${h}</div>${S[k]?`<img src="${esc(S[k])}" alt="" style="max-width:100%;max-height:120px;display:block;margin:8px 0;background:#ddd">`:''}<input type="file" accept="image/*" id="f_${k}"><button class="btn" id="b_${k}" onclick="upImg('${k}')">আপলোড করুন</button>${S[k]?`<button class="btn ol" onclick="delImg('${k}')">মুছে ফেলুন</button>`:''}</div>`;
async function upImg(k){
 const f=$('#f_'+k).files[0];if(!f)return alert('আগে একটা ছবি বাছুন।');
 const b=$('#b_'+k);b.disabled=true;b.textContent='আপলোড হচ্ছে...';
 const png=k=='logo',ty=png?'image/png':'image/jpeg',path='site/'+k+'-'+Date.now()+(png?'.png':'.jpg'),u=await SB.storage.from('products').upload(path,await shrink(f,png?400:1600,ty),{contentType:ty});
 if(u.error){b.disabled=false;b.textContent='আপলোড করুন';return alert('আপলোড হয়নি: '+u.error.message)}
 const{error}=await SB.from('settings').upsert({key:k,value:SB.storage.from('products').getPublicUrl(path).data.publicUrl});
 alert(error?'সেভ হয়নি: '+error.message:'হয়ে গেছে। সাইট রিফ্রেশ করলে দেখা যাবে।');aSet()}
const bnBlock=()=>`<div class="form"><b>হোমপেজের ব্যানার ছবি (স্লাইডে একটার পর একটা চলবে)</b><div class="hint">সর্বোচ্চ ৬টি চওড়া ছবি দিন। একটা দিলে স্থির থাকবে। সবচেয়ে ভালো মাপ: ২৪০০×১০৫০ (অনুপাত ১৬:৭), তাহলে কিছু কাটা পড়বে না। আগে দেওয়া ঝাপসা ছবি মুছে নতুন করে দিন।</div>${BN().map((u,i)=>`<div class="ci"><img src="${esc(u)}" alt=""><div>ছবি ${i+1}</div><button class="btn ol" style="margin:0;width:auto" onclick="delBn(${i})">মুছুন</button></div>`).join('')}<input type="file" accept="image/*" id="f_bn"><button class="btn" id="b_bn" onclick="upBn()">নতুন ব্যানার যোগ করুন</button></div>`;
async function upBn(){
 const f=$('#f_bn').files[0];if(!f)return alert('আগে একটা ছবি বাছুন।');const B=BN();if(B.length>=6)return alert('সর্বোচ্চ ৬টি ব্যানার দেওয়া যায়।');
 const b=$('#b_bn');b.disabled=true;b.textContent='আপলোড হচ্ছে...';
 const path='site/banner-'+Date.now()+'.jpg',u=await SB.storage.from('products').upload(path,await shrink(f,2400,'image/jpeg',.92),{contentType:'image/jpeg'});
 if(u.error){b.disabled=false;b.textContent='নতুন ব্যানার যোগ করুন';return alert('আপলোড হয়নি: '+u.error.message)}
 B.push(SB.storage.from('products').getPublicUrl(path).data.publicUrl);
 const{error}=await SB.from('settings').upsert({key:'banner',value:B.join('|')});alert(error?'সেভ হয়নি: '+error.message:'যোগ হয়েছে।');aSet()}
async function delBn(i){if(!confirm('এই ব্যানার মুছে ফেলবেন?'))return;const B=BN();B.splice(i,1);await SB.from('settings').upsert({key:'banner',value:B.join('|')});aSet()}
async function delImg(k){if(confirm('মুছে ফেলবেন?')){await SB.from('settings').upsert({key:k,value:''});aSet()}}
async function aSet(){await loadS();$('#tb').innerHTML=upBlock('logo','দোকানের লোগো','নামের পাশে দেখাবে। স্বচ্ছ (PNG) ছবি ভালো।')+bnBlock()+`<div class="form">${SF.map(f=>`<label>${f[1]}</label>${f[0]=='info'?`<textarea id="s_info" style="min-height:120px">${esc(S.info)}</textarea>`:`<input id="s_${f[0]}" value="${esc(S[f[0]])}">`}`).join('')}<button class="btn" onclick="svS()">সেটিংস সেভ করুন</button></div>`}
async function svS(){const{error}=await SB.from('settings').upsert(SF.map(f=>({key:f[0],value:$('#s_'+f[0]).value.trim()})));alert(error?'সেভ হয়নি: '+error.message:'সেভ হয়েছে।')}

 if(h=='#admin')return admin();

 /* tidy the address bar: show / and /product/name instead of /#/ and /#/p/name */

 if(history.state&&history.state.ov){history.back();return}
