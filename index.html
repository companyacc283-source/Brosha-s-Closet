<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brosha's Closet - ডেমরা, ঢাকা</title>
<meta name="description" content="Brosha's Closet: থ্রি-পিস, কো-অর্ড সেট, গার্লস ফ্যাশন, কিডস ও পাঞ্জাবি। সারা বাংলাদেশে ডেলিভারি।">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--k:#000;--w:#fff;--g:#b8902f;--gl:#f5ecd4;--l:#e6e6e6;--t:#555}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Hind Siliguri',system-ui,sans-serif;color:var(--k);background:var(--w)}
header{position:sticky;top:0;z-index:5;background:var(--k);padding:10px 14px;display:flex;gap:10px;align-items:center}
.logo{font:700 22px 'Cormorant Garamond',serif;color:var(--g);cursor:pointer;white-space:nowrap}
header input{flex:1;min-width:0;margin:0;padding:8px 14px;border:0;border-radius:20px}
.hb{background:none;border:1px solid var(--g);color:var(--w);padding:6px 12px;border-radius:20px;font:inherit;cursor:pointer;white-space:nowrap}
.hero{background:var(--k);color:var(--g);text-align:center;padding:28px 16px;border-top:1px solid #222}
.hero h1{font:700 28px 'Cormorant Garamond',serif}.hero p{color:#ccc}
.chips,.opt,.th{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.opt{padding:4px 0 8px;flex-wrap:wrap}
.chip{flex:none;border:1px solid var(--k);background:var(--w);color:var(--k);padding:6px 14px;border-radius:20px;font:inherit;cursor:pointer}
.chip.on{background:var(--k);color:var(--g)}.chip:disabled{opacity:.4;text-decoration:line-through}
main{padding:6px 12px 30px;max-width:1000px;margin:auto}.pp{max-width:640px}
.st{margin:18px 0 10px;font-size:19px;border-left:4px solid var(--g);padding-left:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border:1px solid var(--l);cursor:pointer;background:var(--w)}
.ph{position:relative}.ph>img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--l)}
.bd{position:absolute;left:6px;top:6px;background:var(--k);color:var(--g);padding:1px 8px;font-size:12px}
.sh{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.9);border:0;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
.inf{padding:8px 10px 10px}.nm{font-weight:600;line-height:1.3}
.pr{color:var(--g);font-weight:700;font-size:17px}.pr s{color:var(--t);font-weight:400;font-size:13px;margin-left:6px}
.pr.big{font-size:22px}.bd2{background:var(--k);color:var(--g);font-size:12px;padding:1px 8px;margin-left:8px}
.cl{font-size:12px;color:var(--t)}.out{color:#b00020}.empty{padding:30px 0;text-align:center;color:var(--t)}
h2{font-size:20px;margin:10px 0}h3{margin:14px 0 6px}label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid #bbb;font:inherit;margin-bottom:8px;background:var(--w);border-radius:0}
textarea{min-height:70px}
.btn{display:block;width:100%;text-align:center;background:var(--k);color:var(--g);border:1px solid var(--k);padding:13px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px;text-decoration:none}
.btn.gd{background:var(--g);color:var(--k);border-color:var(--g)}.btn.ol{background:var(--w);color:var(--k)}.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two select{margin:10px 0 0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal img{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:3/4;max-height:64vh;object-fit:cover;cursor:zoom-in}
.sw{position:relative;flex:none;width:64px;border:2px solid var(--l);background:var(--w);padding:0;cursor:pointer}
.sw.on{border-color:var(--g)}.sw img{width:100%;height:64px;object-fit:cover;display:block}
.sw button{position:absolute;top:0;left:0;font-size:11px;padding:1px 5px;border:0;background:rgba(255,255,255,.9)}.sw button+button{left:auto;right:0}
.hint{font-size:12px;color:var(--t)}.desc{white-space:pre-wrap;color:#333}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--l)}
.ci>img{width:56px;height:70px;object-fit:cover}.ci>div:nth-child(2){flex:1}
.q{display:flex;gap:8px;align-items:center}.q button{width:32px;height:32px;border:1px solid var(--k);background:var(--w);cursor:pointer}
.tot{font-size:17px;margin:10px 0;text-align:right}
.form{border:1px solid var(--l);padding:12px;margin:12px 0}.pay{background:var(--gl);padding:10px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat{border:1px solid var(--l);padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--g)}
.login{max-width:360px;margin:60px auto;padding:0 16px}
footer{background:var(--k);color:#ccc;text-align:center;padding:22px 16px;font-size:13px;line-height:1.9}footer a{color:var(--g);margin:0 6px}
.fab{position:fixed;right:14px;bottom:16px;background:var(--k);color:var(--g);border:1px solid var(--g);padding:12px 18px;border-radius:30px;font:inherit;font-weight:700;z-index:8;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}#modal.show{display:flex}
.sheet{background:var(--w);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px 24px;position:relative;border-top:3px solid var(--g)}
.x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:22px;cursor:pointer}
#lb{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}#lb .x{color:#fff;z-index:2}
.lbs{flex:1;overflow:auto;display:flex}.lbs img{width:100%;max-height:100%;object-fit:contain;margin:auto;cursor:zoom-in}
.lbs img.z{width:250%;max-width:none;max-height:none;margin:0;cursor:zoom-out}#lb p{color:#aaa;text-align:center;font-size:12px;padding:8px}
.msgs{max-height:46vh;overflow:auto;margin:8px 0}.m{padding:8px 12px;margin:6px 0;max-width:86%;white-space:pre-wrap}.m.u{background:var(--k);color:var(--w);margin-left:auto}.m.a{background:var(--gl)}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.cb{display:flex;gap:6px}.cb input{margin:0}.cb button{background:var(--k);color:var(--g);border:0;padding:0 16px;font:inherit}
</style>
</head>
<body>
<div id="app"></div><div id="modal" onclick="if(event.target==this)closeM()"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Brosha's Closet v2 =====  Sections: setup | storefront | cart+order | track | chat | admin | router */
/* ---- setup ---- */
const SB=supabase.createClient('https://guejjcyzbmagriskgmop.supabase.co','sb_publishable_5uNlCWo0ZoGVNAyEwZ1jTw_-BDU2gVi');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tk=n=>'৳'+Number(n||0).toLocaleString('en-US');
const DV={Dhaka:['Dhaka','Faridpur','Gazipur','Gopalganj','Kishoreganj','Madaripur','Manikganj','Munshiganj','Narayanganj','Narsingdi','Rajbari','Shariatpur','Tangail'],Chattogram:['Chattogram','Bandarban','Brahmanbaria','Chandpur','Cumilla','Cox\'s Bazar','Feni','Khagrachhari','Lakshmipur','Noakhali','Rangamati'],Rajshahi:['Rajshahi','Bogura','Chapainawabganj','Joypurhat','Naogaon','Natore','Pabna','Sirajganj'],Khulna:['Khulna','Bagerhat','Chuadanga','Jashore','Jhenaidah','Kushtia','Magura','Meherpur','Narail','Satkhira'],Barishal:['Barishal','Barguna','Bhola','Jhalokati','Patuakhali','Pirojpur'],Sylhet:['Sylhet','Habiganj','Moulvibazar','Sunamganj'],Rangpur:['Rangpur','Dinajpur','Gaibandha','Kurigram','Lalmonirhat','Nilphamari','Panchagarh','Thakurgaon'],Mymensingh:['Mymensingh','Jamalpur','Netrokona','Sherpur']};
let P=null,CT=[],S={wa:'',bkash:'',nagad:'',rocket:'',d_in:'60',d_out:'120',hero:'',fb:'',info:''},cart=[],cat='',q='',sel={},hist=[],ed=null,AP=[],OL=[],OF='';
try{cart=JSON.parse(localStorage.getItem('cart2')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('cart2',JSON.stringify(cart))}catch(e){}const c=$('#cc');if(c)c.textContent=cart.reduce((a,x)=>a+x.q,0)};
const sub=()=>cart.reduce((a,c)=>a+c.price*c.q,0),stk=v=>Object.values(v.sizes||{}).reduce((a,n)=>a+(+n||0),0);
const vs=p=>(p.product_variants||[]).slice().sort((a,b)=>a.sort-b.sort),left=p=>vs(p).reduce((a,v)=>a+stk(v),0);
const img=p=>{const v=vs(p)[0];return v&&v.images[0]||''},disc=p=>p.old_price>p.price?Math.round((p.old_price-p.price)/p.old_price*100):0;
const SZ=['XXS','XS','S','M','L','XL','XXL','XXXL'],szs=v=>Object.entries(v.sizes||{}).sort((a,b)=>(SZ.indexOf(a[0])+1||99)-(SZ.indexOf(b[0])+1||99));
const catName=id=>(CT.find(c=>c.id==id)||{}).name||'';
const fee=d=>+(d=='Dhaka'?S.d_in:S.d_out)||0;
async function loadS(){try{const{data}=await SB.from('settings').select('*');(data||[]).forEach(r=>S[r.key]=r.value)}catch(e){}}
async function loadP(){const[a,b]=await Promise.all([SB.from('products').select('*,product_variants(*)').eq('is_active',true).order('created_at',{ascending:false}),SB.from('categories').select('*').order('sort')]);P=a.data||[];CT=b.data||[]}
function modal(h){$('#modal').innerHTML=`<div class="sheet"><button class="x" onclick="closeM()">✕</button>${h}</div>`;$('#modal').classList.add('show')}
const closeM=()=>$('#modal').classList.remove('show');
function share(slug){const u=location.origin+'/#/p/'+slug,t=encodeURIComponent(u);modal(`<h2>শেয়ার করুন</h2><a class="btn" target="_blank" href="https://wa.me/?text=${t}">WhatsApp</a><a class="btn" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${t}">Facebook</a><button class="btn ol" onclick="navigator.clipboard.writeText('${u}').then(()=>alert('লিংক কপি হয়েছে'))">লিংক কপি করুন</button>${navigator.share?`<button class="btn ol" onclick="navigator.share({url:'${u}'})">অন্যান্য অ্যাপে</button>`:''}`)}

/* ---- storefront ---- */
const frame=()=>`<header><div class="logo" onclick="location.hash='/'">Brosha's Closet</div><input placeholder="প্রোডাক্ট খুঁজুন" oninput="doSearch(this.value)"><button class="hb" onclick="location.hash='/cart'">কার্ট <span id="cc">0</span></button></header><div id="v"></div><footer>দোকান ২৫, পূর্বানী প্লাজা, কোনাপাড়া, ডেমরা, ঢাকা<br>সারা বাংলাদেশে ডেলিভারি<br><a href="#/track">অর্ডার ট্র্যাক করুন</a>${S.fb?`<a href="${esc(S.fb)}" target="_blank">Facebook</a>`:''}${S.wa?`<a href="https://wa.me/${esc(S.wa)}" target="_blank">WhatsApp</a>`:''}<a href="#admin">Admin</a><br><small>v2.1</small></footer><button class="fab" onclick="openChat()">সাহায্য</button>`;
async function shop(path){
 if(!$('#v'))$('#app').innerHTML=frame();
 if(!P){$('#v').innerHTML='<p class="empty">লোড হচ্ছে...</p>';await loadS();await loadP()}
 scrollTo(0,0);const m=path.match(/^\/p\/(.+)/);
 m?prod(m[1]):path=='/cart'?cartPg():path=='/track'?trackPg():home();save()}
const card=p=>`<div class="card" onclick="location.hash='/p/${p.slug}'"><div class="ph"><img loading="lazy" src="${esc(img(p))}" alt="${esc(p.name)}">${disc(p)?`<b class="bd">-${disc(p)}%</b>`:''}<button class="sh" onclick="event.stopPropagation();share('${p.slug}')">শেয়ার</button></div><div class="inf"><div class="nm">${esc(p.name)}</div><div class="pr">${tk(p.price)}${p.old_price?`<s>${tk(p.old_price)}</s>`:''}</div><div class="cl">${left(p)?esc(vs(p).map(v=>v.color).filter(Boolean).join(' · ')):'<span class="out">স্টক নেই</span>'}</div></div></div>`;
function home(){
 const f=P.filter(p=>(!cat||p.category_id==cat)&&(!q||hay(p).includes(q.trim().toLowerCase()))),rich=!cat&&!q;
 const g=(t,l)=>l.length?`<h2 class="st">${t}</h2><div class="grid">${l.map(card).join('')}</div>`:'';
 $('#v').innerHTML=`${rich?`<div class="hero"><h1>${esc(S.hero||"Brosha's Closet")}</h1><p>সারা বাংলাদেশে ডেলিভারি</p></div>`:''}<div class="chips"><button class="chip ${cat?'':'on'}" onclick="cat='';home()">সব</button>${CT.map(c=>`<button class="chip ${cat==c.id?'on':''}" onclick="cat='${c.id}';home()">${esc(c.name)}</button>`).join('')}</div><main>${rich?g('নতুন এসেছে',f.slice(0,8))+g('বেস্ট সেলার',f.filter(p=>p.best_seller))+g('বিশেষ অফার',f.filter(p=>disc(p)))+g('ফিচার্ড',f.filter(p=>p.featured))+g('সব প্রোডাক্ট',f):g(esc(cat?catName(cat):'ফলাফল'),f)}${f.length?'':'<p class="empty">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>'}</main>`}
const hay=p=>[p.name,p.description,catName(p.category_id),...vs(p).map(v=>v.color)].join(' ').toLowerCase();
function doSearch(v){q=v;cat='';location.hash.length>2?location.hash='/':home()}
function prod(slug){
 const p=P.find(x=>x.slug==slug);if(!p)return $('#v').innerHTML='<p class="empty">প্রোডাক্ট পাওয়া যায়নি।</p>';
 document.title=p.name+" - Brosha's Closet";sel={p,v:Math.max(0,vs(p).findIndex(v=>stk(v)>0)),s:'',n:1};pv()}
function pv(){
 const{p,v:vi,s,n}=sel,V=vs(p),v=V[vi],price=v.price??p.price,mx=s?+v.sizes[s]:1;
 $('#v').innerHTML=`<main class="pp"><div class="gal" id="gal" onscroll="gs()">${v.images.map((u,i)=>`<img src="${esc(u)}" alt="${esc(p.name)} ${esc(v.color)}" onclick="zoom(${i})">`).join('')}</div>${v.images.length>1?`<div class="th">${v.images.map((u,i)=>`<button class="sw ${i?'':'on'}" onclick="go(${i})"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`:''}<h2>${esc(p.name)}</h2><div class="pr big">${tk(price)}${p.old_price?`<s>${tk(p.old_price)}</s><b class="bd2">-${disc(p)}%</b>`:''}</div><label>রঙ: <b>${esc(v.color||'Default')}</b></label><div class="opt">${V.map((x,i)=>`<button class="chip ${i==vi?'on':''}" ${stk(x)?'':'disabled'} onclick="sel.v=${i};sel.s='';sel.n=1;pv()">${esc(x.color||'Default')}${stk(x)?'':' (শেষ)'}</button>`).join('')}</div><label>সাইজ</label><div class="opt">${szs(v).map(([k,c])=>`<button class="chip ${k==s?'on':''}" ${+c>0?'':'disabled'} onclick="sel.s='${esc(k)}';sel.n=1;pv()">${esc(k)}</button>`).join('')}</div>${s?`<div class="hint">স্টকে আছে: ${mx}টি</div>`:''}<label>পরিমাণ</label><div class="q"><button onclick="sel.n=Math.max(1,sel.n-1);pv()">−</button><b>${n}</b><button onclick="sel.n=Math.min(${mx},sel.n+1);pv()">+</button></div><div class="two"><button class="btn" onclick="addC(false)">কার্টে যোগ করুন</button><button class="btn gd" onclick="addC(true)">এখনই কিনুন</button></div><button class="btn ol" onclick="share('${p.slug}')">শেয়ার করুন</button><h3>বিবরণ</h3><p class="desc">${esc(p.description||'')}</p></main>`}
function go(i){const g=$('#gal');g.scrollTo({left:i*g.clientWidth,behavior:'smooth'})}
function gs(){const g=$('#gal'),i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll('.th .sw').forEach((b,j)=>b.classList.toggle('on',j==i))}
function zoom(i){const d=document.createElement('div');d.id='lb';d.innerHTML=`<button class="x" onclick="lbx()">✕</button><div class="lbs"><img src="${esc(vs(sel.p)[sel.v].images[i])}" alt="" onclick="this.classList.toggle('z')"></div><p>ট্যাপ করলে জুম হবে, আঙুল দিয়ে সরিয়ে দেখুন</p>`;document.body.appendChild(d)}
const lbx=()=>{const d=$('#lb');d&&d.remove()};
function addC(buy){
 const{p,v:vi,s,n}=sel,v=vs(p)[vi];if(!s)return alert('সাইজ বেছে নিন');
 const mx=+v.sizes[s],k=cart.find(x=>x.vid==v.id&&x.size==s);
 if(k)k.q=Math.min(mx,k.q+n);else cart.push({vid:v.id,name:p.name,color:v.color,size:s,price:v.price??p.price,img:v.images[0],q:Math.min(mx,n),max:mx});
 save();buy?location.hash='/cart':alert('কার্টে যোগ হয়েছে')}

/* ---- cart + order ---- */
function cartPg(){
 if(!cart.length)return $('#v').innerHTML='<main class="pp"><h2>কার্ট খালি</h2><a class="btn" href="#/">কেনাকাটা শুরু করুন</a></main>';
 const pays=['COD',...['bKash','Nagad','Rocket'].filter(k=>S[k.toLowerCase()])];
 $('#v').innerHTML=`<main class="pp"><h2>আপনার কার্ট</h2>${cart.map((c,i)=>`<div class="ci"><img src="${esc(c.img)}" alt=""><div><b>${esc(c.name)}</b><br>${esc(c.color)} ${esc(c.size)} | ${tk(c.price)}</div><div class="q"><button onclick="cq(${i},-1)">−</button>${c.q}<button onclick="cq(${i},1)">+</button></div></div>`).join('')}<div class="tot">সাব-টোটাল: <b>${tk(sub())}</b></div><h3>ডেলিভারির তথ্য</h3><input id="nm" placeholder="আপনার নাম"><input id="ph" type="tel" placeholder="মোবাইল নম্বর (01XXXXXXXXX)"><input id="al" type="tel" placeholder="বিকল্প নম্বর (ঐচ্ছিক)"><select id="dv" onchange="dvc()">${Object.keys(DV).map(d=>`<option>${d}</option>`).join('')}</select><select id="ds" onchange="tt()"></select><input id="th" placeholder="থানা / উপজেলা"><textarea id="ad" placeholder="সম্পূর্ণ ঠিকানা"></textarea><textarea id="nt" placeholder="ডেলিভারি নির্দেশনা (ঐচ্ছিক)" style="min-height:50px"></textarea><label>পেমেন্ট</label><select id="pm" onchange="pmc()">${pays.map(p=>`<option value="${p}">${p=='COD'?'ক্যাশ অন ডেলিভারি':p}</option>`).join('')}</select><div id="pi"></div><div class="tot">ডেলিভারি: <b id="dl"></b><br>সর্বমোট: <b id="tt"></b></div><button class="btn" id="ob" onclick="order()">অর্ডার নিশ্চিত করুন</button></main>`;dvc()}
function cq(i,d){const c=cart[i];c.q=Math.min(c.max,c.q+d);if(c.q<1)cart.splice(i,1);save();cartPg()}
function dvc(){$('#ds').innerHTML=DV[$('#dv').value].map(d=>`<option>${d}</option>`).join('');tt()}
function tt(){const f=fee($('#ds').value);$('#dl').textContent=tk(f);$('#tt').textContent=tk(sub()+f)}
function pmc(){const m=$('#pm').value;$('#pi').innerHTML=m=='COD'?'':`<div class="pay">${m} নম্বর <b>${esc(S[m.toLowerCase()])}</b>-এ মোট টাকা Send Money করুন, তারপর TrxID লিখুন।</div><input id="trx" placeholder="TrxID">`}
async function order(){
 const g=id=>(($('#'+id)||{}).value||'').trim(),pm=g('pm'),b=$('#ob');
